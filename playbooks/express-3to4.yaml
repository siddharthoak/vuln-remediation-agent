component: "express"
from_major: 3
to_major: 4
confidence: high
breaking_changes:
  - "Built-in middleware removed from Express core (except express.static); all middleware moved to separate standalone packages (body-parser, cookie-parser, express-session, morgan, serve-favicon, compression, errorhandler, method-override)"
  - "app.configure() has been completely removed; use environment checks (if process.env.NODE_ENV === ...) or execute configuration directly"
  - "app.router has been removed; middleware and routes are executed in the exact order they are declared with app.use() and app.VERB()"
  - "res.send(status, body) and res.send(body, status) signature changed; use res.status(status).send(body)"
  - "res.json(status, obj) signature changed; use res.status(status).json(obj)"
  - "req.param(name) method is deprecated in favor of explicit lookup on req.params, req.body, or req.query"
api_removals:
  - "app.configure"
  - "app.router"
  - "express.bodyParser"
  - "express.cookieParser"
  - "express.session"
  - "express.logger"
  - "express.favicon"
  - "express.compress"
  - "express.errorHandler"
  - "express.methodOverride"
  - "express.responseTime"
  - "express.directory"
  - "express.vhost"
  - "express.csrf"
migration_steps:
  - "Update package.json express dependency to version ^4.18.0 (or latest 4.x)"
  - "Install standalone middleware packages: npm install body-parser cookie-parser express-session morgan serve-favicon compression method-override errorhandler"
  - "Remove app.use(app.router) calls from server setup"
  - "Remove app.configure() wrapper blocks and place configuration statements directly in file or inside standard if (process.env.NODE_ENV === '...') statements"
  - "Replace express.<middleware>() references with required standalone packages (e.g., const bodyParser = require('body-parser'))"
  - "Update response status calls from res.send(status, body) to res.status(status).send(body) and res.json(status, obj) to res.status(status).json(obj)"
patterns:
  - find: "app.use(app.router);"
    replace: "// app.router removed in Express 4"
    description: "Remove explicit app.router mounting"
  - find: "require('express').bodyParser"
    replace: "require('body-parser')"
    description: "Replace express.bodyParser require with standalone body-parser"
  - find: "express.bodyParser()"
    replace: "bodyParser.urlencoded({ extended: true }), bodyParser.json()"
    description: "Replace express.bodyParser() with standalone body-parser middleware"
  - find: "express.cookieParser("
    replace: "cookieParser("
    description: "Replace express.cookieParser() with standalone cookie-parser"
  - find: "express.session("
    replace: "session("
    description: "Replace express.session() with standalone express-session"
  - find: "express.logger("
    replace: "morgan("
    description: "Replace express.logger() with standalone morgan logger"
  - find: "express.favicon("
    replace: "favicon("
    description: "Replace express.favicon() with standalone serve-favicon"
  - find: "express.compress("
    replace: "compression("
    description: "Replace express.compress() with standalone compression"
  - find: "express.methodOverride("
    replace: "methodOverride("
    description: "Replace express.methodOverride() with standalone method-override"
  - find: "express.errorHandler("
    replace: "errorhandler("
    description: "Replace express.errorHandler() with standalone errorhandler"
  - find: "app.configure(function() {"
    replace: "// app.configure removed in Express 4\n(function() {"
    description: "Remove app.configure wrapper"
  - find: "app.configure(function () {"
    replace: "// app.configure removed in Express 4\n(function () {"
    description: "Remove app.configure wrapper"
  - find: "res.send(200,"
    replace: "res.status(200).send("
    description: "Replace res.send(status, body) with chained status call"
  - find: "res.send(404,"
    replace: "res.status(404).send("
    description: "Replace res.send(status, body) with chained status call"
  - find: "res.send(500,"
    replace: "res.status(500).send("
    description: "Replace res.send(status, body) with chained status call"
  - find: "res.json(200,"
    replace: "res.status(200).json("
    description: "Replace res.json(status, obj) with chained status call"
  - find: "res.json(404,"
    replace: "res.status(404).json("
    description: "Replace res.json(status, obj) with chained status call"
  - find: "res.json(500,"
    replace: "res.status(500).json("
