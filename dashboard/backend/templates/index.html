<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSS Remediation Agent — Dashboard</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; min-height: 100vh; }
  aside { width: 260px; flex: none; padding: 1rem; border-right: 1px solid #8883; }
  main { flex: 1; padding: 1.5rem; min-width: 0; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
  .card { border: 1px solid #8883; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; }
  .ok { color: #16a34a; } .warn { color: #d97706; } .err { color: #dc2626; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #8883; white-space: nowrap; }
  th { position: sticky; top: 0; background: Canvas; }
  .tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; border-bottom: 1px solid #8883; }
  .tabs button { padding: 0.5rem 1rem; border: none; background: none; cursor: pointer; font-size: 0.9rem; border-bottom: 2px solid transparent; }
  .tabs button.active { border-bottom-color: currentColor; font-weight: 600; }
  select { padding: 0.3rem; margin-right: 0.5rem; }
  .metric-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .metric { border: 1px solid #8883; border-radius: 8px; padding: 0.75rem 1rem; min-width: 110px; }
  .metric .value { font-size: 1.4rem; font-weight: 700; }
  .metric .label { font-size: 0.75rem; opacity: 0.7; }
  .bar-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; font-size: 0.8rem; }
  .bar-label { width: 140px; flex: none; text-align: right; opacity: 0.8; }
  .bar-track { flex: 1; background: #8882; border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { background: #3b82f6; height: 100%; }
  .bar-value { width: 60px; flex: none; opacity: 0.8; }
  details { border: 1px solid #8883; border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
  summary { cursor: pointer; }
  code, pre { background: #8881; border-radius: 4px; padding: 0.1rem 0.3rem; }
  pre { padding: 0.5rem; overflow-x: auto; white-space: pre-wrap; }
  .pattern { display: flex; gap: 0.5rem; }
  .pattern code { flex: 1; }
</style>
</head>
<body>

<aside>
  <h1>&#128737;&#65039; Remediation Agent</h1>
  {% include "partials/sidebar.html" %}
</aside>

<main>
  <div class="tabs">
    <button class="active" hx-get="/partials/run-history" hx-target="#tab-content" hx-swap="innerHTML"
            onclick="document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">
      Run History
    </button>
    <button hx-get="/partials/retry-lineage" hx-target="#tab-content" hx-swap="innerHTML"
            onclick="document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">
      Retry Lineage
    </button>
    <button hx-get="/partials/metrics" hx-target="#tab-content" hx-swap="innerHTML"
            onclick="document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">
      Metrics
    </button>
    <button hx-get="/partials/kb" hx-target="#tab-content" hx-swap="innerHTML"
            onclick="document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">
      Knowledge Base
    </button>
  </div>

  <div id="tab-content">
    {% include "partials/run_history.html" %}
  </div>
</main>

</body>
</html>
