<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSS Remediation Agent — Dashboard</title>
<script src="/static/htmx.min.js"></script>
<style>
  /* ── Neurealm Typography System: Dual-Font Track ─────────────────────────
     Vendored locally (no CDN dependency) in dashboard/backend/static/fonts/.
     Both are variable fonts -- one file covers the whole 400-700 weight axis,
     declared as a range so normal font-weight usage interpolates correctly. */
  @font-face {
    font-family: "Exo"; font-style: normal; font-weight: 400 700;
    src: url("/static/fonts/Exo.woff2") format("woff2");
    font-display: swap;
  }
  @font-face {
    font-family: "Gabarito"; font-style: normal; font-weight: 400 700;
    src: url("/static/fonts/Gabarito.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    /* Neurealm's design system only ships a Light Mode applied-scheme (no
       dark-mode skill exists yet) -- pinned to light, not following OS
       preference, since there's no dark scheme to honor faithfully. */
    color-scheme: light;

    /* ── Neurealm Design System: Light Mode Applied Schemes ── */
    --scheme-primary: #081160;              --scheme-on-primary: #F1F0FF;
    --scheme-primary-container: #081160;    --scheme-on-primary-container: #DDE1FF;
    --scheme-secondary: #4EA0EF;            --scheme-on-secondary: #F1F7FF;
    --scheme-secondary-container: #D1E9FF;  --scheme-on-secondary-container: #00335F;
    --scheme-tertiary: #FFFFEF;             --scheme-on-tertiary: #212936;
    --scheme-error: #EB1414;                --scheme-on-error: #F2E9E9;
    --scheme-error-container: #931616;      --scheme-on-error-container: #ECCBCB;
    --scheme-background: #F1F0FF;           --scheme-on-background: #131927;
    --scheme-surface: #F3F4F6;              --scheme-on-surface: #000000;
    --scheme-surface-variant: #E5E7EA;      --scheme-on-surface-variant: #212936;
    --scheme-outline: #4D5461;              --scheme-outline-variant: #6D717F;
    --scheme-surface-container-lowest: #FFFFFF;
    --scheme-surface-container: #F3F4F6;
    --scheme-surface-container-highest: #ECFDFD;

    /* Functional status: text/accent uses primitive steps >700, backgrounds
       use steps <300 -- core-color-primitives' own WCAG guardrail ("use step
       indicators below step 300 for backgrounds, above step 700 for type"). */
    --ok: #208846;      --ok-bg: #E9F1EC;   /* Colors/Success/Green-700 / -100 */
    --warn: #986610;    --warn-bg: #F2EEDF; /* Colors/Warning-700 / -100 */
    --err: #931616;     --err-bg: #F2E9E9;  /* Colors/Error-700 / -100 (== Schemes/Error Container / On Error) */

    --accent: var(--scheme-primary);
    --card-bg: var(--scheme-surface-container-lowest);
    --stripe-bg: var(--scheme-surface-variant);

    /* Dual-track assignment per the typography skill's own rule: Exo for
       consumer-facing/dashboard-shell screens, Gabarito for technical side
       panes, data grids, tabular layouts, and operational metrics lists. */
    --font-exo: "Exo", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-gabarito: "Gabarito", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-exo); font-weight: 500; margin: 0; display: flex; min-height: 100vh;
    background: var(--scheme-background); color: var(--scheme-on-background); }
  aside { width: 260px; flex: none; padding: 1.25rem; border-right: 1px solid var(--scheme-outline-variant); }
  main { flex: 1; padding: 1.5rem 2rem; min-width: 0; }
  #tab-content { max-width: 900px; }
  /* Title Large (Exo, 24px/36px/700) -- app-shell-level header, not data. */
  h1 { font-size: 1.5rem; line-height: 2.25rem; font-weight: 700; margin: 0 0 1.25rem; letter-spacing: 0; }
  /* Label Large (Exo, 14px/20px/600) uppercased -- section/category labels. */
  h2 { font-size: 0.875rem; line-height: 1.25rem; margin: 1.75rem 0 0.6rem; text-transform: uppercase;
    letter-spacing: 0.03em; opacity: 0.7; font-weight: 600; }
  h2:first-of-type { margin-top: 0.25rem; }
  .card { border: 1px solid var(--scheme-outline-variant); border-radius: 10px; padding: 0.8rem 0.9rem;
    margin-bottom: 0.75rem; background: var(--card-bg); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }

  /* Primary action button (Trigger KB Import, etc.) -- Label Large (Exo,
     14px/600) is this variant's own documented "button triggers" usage.
     Primary-900/-800 background steps come straight from the color
     primitives skill's own scale, not invented values. */
  .btn { display: inline-flex; align-items: center; gap: 0.45rem; white-space: nowrap;
    font-family: var(--font-exo); font-size: 0.875rem; font-weight: 600; line-height: 1.25rem;
    padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    transition: background 0.15s, filter 0.1s, opacity 0.15s; }
  .btn-primary { background: var(--scheme-primary); color: var(--scheme-on-primary); }
  .btn-primary:hover:not(:disabled) { background: #202B81; } /* Colors/Primary/Primary-800 */
  .btn-primary:active:not(:disabled) { filter: brightness(0.88); }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; }
  .btn:focus-visible { outline: 2px solid var(--scheme-secondary); outline-offset: 2px; }
  .btn .icon { font-size: 0.95em; line-height: 1; }
  .btn .spinner { width: 0.8em; height: 0.8em; border-radius: 50%; flex: none;
    border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: currentColor;
    animation: btn-spin 0.7s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .btn .spinner { animation: none; } }
  @keyframes btn-spin { to { transform: rotate(360deg); } }

  .kb-import-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .kb-import-status { flex: 1; min-width: 200px; }
  .kb-import-status p { margin: 0; }
  .kb-import-status .bar-row { margin-bottom: 0.3rem; }

  /* Sidebar Demo Controls -- narrow (260px aside), so each control's own
     .kb-import-row (button + status) wraps to its own lines via flex-wrap
     rather than trying to force a single-row layout in a tight column. */
  .demo-controls { display: flex; flex-direction: column; gap: 0.6rem; }
  .demo-controls .kb-import-row { gap: 0.4rem; }
  .demo-controls .btn { font-size: 0.8rem; padding: 0.4rem 0.7rem; width: 100%; justify-content: center; }
  .demo-controls .kb-import-status { font-size: 0.78rem; min-width: 0; }

  /* "Next:" hint -- the one thing on this card that should read at a
     glance, so it gets a filled callout instead of plain text. */
  .demo-hint { background: var(--scheme-secondary-container); color: var(--scheme-on-secondary-container);
    border-radius: 8px; padding: 0.5rem 0.65rem; font-size: 0.78rem; font-weight: 600; line-height: 1.3; }

  /* Reset sits apart from the numbered flow -- outlined, not filled, so it
     doesn't read as "step 0" of the sequence below it. */
  .btn-outline { background: transparent; color: var(--scheme-primary); border-color: var(--scheme-outline-variant); }
  .btn-outline:hover:not(:disabled) { background: var(--scheme-surface-variant); }
  .demo-reset-note { margin: 0; opacity: 0.6; }
  #reset-result p { margin: 0.3rem 0 0; font-size: 0.78rem; }

  .demo-step { border-top: 1px solid var(--scheme-outline-variant); padding-top: 0.6rem; }
  .demo-step-head { display: flex; align-items: center; gap: 0.4rem; font-family: var(--font-exo);
    font-size: 0.85rem; font-weight: 700; }
  .step-badge { display: inline-flex; align-items: center; justify-content: center; width: 1.15rem; height: 1.15rem;
    border-radius: 50%; background: var(--scheme-primary); color: var(--scheme-on-primary);
    font-size: 0.68rem; font-weight: 700; flex: none; }
  .demo-step-caption { margin: 0.15rem 0 0.5rem; font-size: 0.72rem; opacity: 0.65; line-height: 1.3; }

  .scan-mode-toggle { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.5rem;
    font-size: 0.76rem; }
  .scan-mode-toggle label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .scan-mode-toggle small { opacity: 0.6; }
  .scan-mode-panel { margin-top: 0.3rem; }

  /* "Skip the Wait" is NOT step 3 of the flow -- Watcher already runs this
     cycle autonomously every 15 min, so this control is styled like an
     optional utility (outline button, "optional" tag, no number badge)
     rather than looking like a required manual step. */
  .demo-utility { border-top: 1px dashed var(--scheme-outline-variant); padding-top: 0.6rem; }
  .demo-utility-head { justify-content: flex-start; }
  .optional-tag { font-family: var(--font-gabarito); font-size: 0.62rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.5; }
  .demo-utility .btn { background: transparent; color: var(--scheme-primary); border-color: var(--scheme-outline-variant); }
  .demo-utility .btn:hover:not(:disabled) { background: var(--scheme-surface-variant); }

  /* Findings tab bucket badge -- deliberately NOT the pr-badge palette
     (that's reserved for real GitHub PR state) -- just two states here:
     auto-fixable vs. routed to human triage. */
  .bucket-badge { display: inline-flex; align-items: center; white-space: nowrap;
    padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .bucket-badge.bucket-auto { background: var(--ok-bg); color: var(--ok); }
  .bucket-badge.bucket-triage { background: var(--warn-bg); color: var(--warn); }

  /* Title Medium (Exo, 16px/28px/500) -- "navigation menu selections" is
     this variant's own documented usage. */
  .tabs { display: flex; gap: 0.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--scheme-outline-variant); }
  .tabs button { padding: 0.6rem 1.1rem; border: none; background: none; cursor: pointer;
    font-family: var(--font-exo); font-size: 1rem; line-height: 1.75rem; font-weight: 500;
    border-bottom: 2px solid transparent; opacity: 0.6; transition: opacity 0.15s; }
  .tabs button:hover { opacity: 1; }
  .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; opacity: 1; }

  select { padding: 0.35rem 0.5rem; margin-right: 0.5rem; border-radius: 6px;
    border: 1px solid var(--scheme-outline-variant); background: var(--card-bg); font-family: var(--font-gabarito); }

  .metric-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  /* max-width applies to every tile, not just the long-text ones below --
     a long LABEL (e.g. "Classifier bucket, KB: be59702e...") can make a tile
     look oversized even when its value is short ("Bucket 2"), so both value
     and label truncate with an ellipsis + tooltip rather than wrapping/
     growing the tile to fit. */
  .metric { border: 1px solid var(--scheme-outline-variant); border-radius: 10px; padding: 0.75rem 1rem;
    min-width: 110px; max-width: 220px; background: var(--scheme-surface); }
  /* Title Large (Exo, 24px/700) for the stat itself -- "key performance data
     point" is this variant's own documented usage -- with line-height tightened
     from the spec's 36px for a compact tile (a deliberate, scoped exception;
     the 36px value assumes paragraph-level contexts, not a single-line stat). */
  .metric .value { font-family: var(--font-exo); font-size: 1.5rem; line-height: 1.2; font-weight: 700; }
  /* Label Medium (Gabarito, 12px/16px/500, 0.5px tracking) -- "metadata
     categories" is this variant's own documented usage. */
  .metric .label { font-family: var(--font-gabarito); font-size: 0.75rem; line-height: 1rem; font-weight: 500;
    letter-spacing: 0.03125rem; opacity: 0.65; margin-top: 0.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Text-content tiles (branch names, CVE ids, component names) don't get
     the big bold numeric-stat treatment -- at 24px bold, a value like
     "fix/org-springframework-spring-core-c09e05ff" dwarfs neighboring tiles
     showing a single number. Title Small (Gabarito, 14px/400) instead --
     "inner component subtitles" -- truncated with a tooltip for the full value. */
  .metric-text { max-width: 220px; }
  .metric-text .value { font-family: var(--font-gabarito); font-size: 0.875rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Label Medium (Gabarito) -- chart axis/legend text is this variant's own
     documented usage. */
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0;
    font-family: var(--font-gabarito); font-size: 0.75rem; }
  .bar-label { width: 150px; flex: none; text-align: right; opacity: 0.75; }
  .bar-track { flex: 1; background: var(--scheme-surface-variant); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 4px; }
  .bar-value { width: 70px; flex: none; opacity: 0.75; font-variant-numeric: tabular-nums; }

  /* Expandable record cards (Run History, Retry Lineage) -- status-colored
     left accent + alternating background so a long list stays scannable. */
  .record-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
  details { border: 1px solid var(--scheme-outline-variant); border-left: 3px solid var(--scheme-outline-variant);
    border-radius: 8px; padding: 0.55rem 0.85rem; background: var(--card-bg); }
  .record-card:nth-child(even) { background: var(--stripe-bg); }
  details.status-ok { border-left-color: var(--ok); }
  details.status-warn { border-left-color: var(--warn); }
  details.status-err { border-left-color: var(--err); }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { opacity: 0.85; }

  /* One run-group per (repo, scan-trigger minute) -- see _group_by_run in
     app.py. Visually distinct from the individual record cards nested
     inside it (no status color, since a group spans multiple statuses). */
  .run-group { border-left-color: var(--scheme-outline-variant); background: var(--scheme-surface); padding: 0.6rem 0.85rem; }
  .run-group-summary { display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap;
    font-family: var(--font-exo); font-size: 0.85rem; }
  .run-group-repo { font-weight: 700; }
  .run-group-label { opacity: 0.7; }
  .run-group-count { opacity: 0.7; font-size: 0.8rem; }
  .run-group-tally { margin-left: auto; font-size: 0.78rem; display: flex; gap: 0.6rem; }
  .run-group-records { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.7rem; }
  /* Fixed grid columns -- NOT flex -- so a long value in one column (e.g.
     component name) truncates in place instead of pushing every column
     after it out of alignment across rows. Gabarito: this row is a data-grid
     line (component/version/status/PR), the typography skill's own use case
     for the technical track. */
  .record-card summary {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) 130px minmax(0, 1.9fr) 96px;
    align-items: center;
    gap: 0.75rem;
    font-family: var(--font-gabarito);
    font-size: 0.875rem;
  }
  .record-card summary > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .record-card summary .col-component { font-weight: 600; }
  .record-card summary .col-version { opacity: 0.75; font-size: 0.8rem; }
  .record-card summary .col-status small { opacity: 0.6; font-weight: 400; }
  .record-card summary .col-pr { text-align: right; overflow: visible; }
  .link { color: var(--accent); text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* Discoverable help affordance -- hover (title attr, multi-line: general
     bucket definition + this finding's specific classifier rationale) for
     "why did this land in Bucket N" without cluttering the tile itself. */
  .help-icon { opacity: 0.55; cursor: help; font-size: 0.85em; }
  .help-icon:hover { opacity: 1; }

  /* GitHub-style PR-state pill badges -- colored background + white label,
     matching github.com's own Open/Merged/Closed badges (not a colored
     dot icon). "None" is deliberately muted/outlined so it doesn't compete
     visually with the colored states -- it's the absence of one. */
  .pr-badge {
    display: inline-flex; align-items: center; white-space: nowrap;
    padding: 0.2rem 0.65rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; text-decoration: none;
  }
  /* Deliberately NOT remapped to Neurealm scheme colors -- these mimic
     GitHub's own real Open/Merged/Closed badge colors on purpose, so a PR's
     state reads instantly to anyone who's used GitHub. */
  .pr-badge.open   { background: #1a7f37; color: #fff; }
  .pr-badge.merged { background: #8250df; color: #fff; }
  .pr-badge.closed { background: #cf222e; color: #fff; }
  .pr-badge.unknown { background: #6e7781; color: #fff; }
  .pr-badge.none { background: transparent; color: inherit; opacity: 0.55; border: 1px dashed var(--scheme-outline-variant); font-weight: 500; }
  .pr-badge.open:hover, .pr-badge.merged:hover, .pr-badge.closed:hover, .pr-badge.unknown:hover { filter: brightness(1.1); }
  details[open] { border-left-width: 4px; }
  details > *:not(summary) { margin-top: 0.6rem; }

  code, pre { font-family: var(--font-gabarito); background: var(--scheme-surface-variant); border-radius: 4px; padding: 0.1rem 0.3rem; }
  pre { padding: 0.5rem; overflow-x: auto; white-space: pre-wrap; }
  .pattern { display: flex; gap: 0.5rem; }
  .pattern code { flex: 1; }

  /* Knowledge Base table -- fixed column widths (table-layout: fixed, not
     content-driven) so a long component name or version string can't push
     other columns out of alignment, same reasoning as the record-card grid.
     Gabarito throughout: this is the canonical "data grid, tabular layout"
     case the typography skill's dual-track rule calls out by name. */
  .kb-table { width: 100%; border-collapse: collapse; table-layout: fixed;
    font-family: var(--font-gabarito); font-size: 0.875rem; margin-top: 0.75rem; }
  .kb-table col.col-source     { width: 130px; }
  .kb-table col.col-component  { width: 26%; }
  .kb-table col.col-version    { width: 190px; }
  .kb-table col.col-confidence { width: 100px; }
  .kb-table col.col-details    { width: auto; }
  .kb-table th, .kb-table td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--scheme-outline-variant); vertical-align: top; }
  .kb-table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03125rem; opacity: 0.7; font-weight: 600; }
  .kb-table tbody tr:nth-child(even) { background: var(--stripe-bg); }
  .kb-table td.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-table .muted { opacity: 0.4; }
  .kb-table details { border: none; padding: 0; margin: 0; }
  .kb-table details summary { color: var(--accent); font-size: 0.8rem; }
  /* The Details column is narrow by design (the fixed-width columns before it
     take most of the table's 900px budget) -- multi-paragraph breaking-changes/
     migration-steps content wrapping inside that sliver is unreadable. Instead
     of growing the column (which would just shrink the others), the expanded
     panel breaks out as a wide floating overlay anchored to its own cell,
     rather than being constrained to the column's own width. */
  .kb-table td:last-child { position: relative; }
  .kb-table .kb-detail-panel {
    position: absolute;
    top: 100%; right: 0;
    width: min(32rem, 90vw);
    max-height: 26rem;
    overflow-y: auto;
    margin-top: 0.35rem;
    background: var(--card-bg);
    border: 1px solid var(--scheme-outline-variant);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    z-index: 20;
    white-space: normal;
    position: relative; /* positioning context for the close button below */
  }
  .kb-detail-close {
    position: absolute; top: 0.4rem; right: 0.5rem;
    border: none; background: none; cursor: pointer;
    font-size: 1.1rem; line-height: 1; opacity: 0.5; padding: 0.2rem;
    color: var(--scheme-on-background);
  }
  .kb-detail-close:hover { opacity: 1; }

  /* Pipeline tab -- aggregate node-and-arrow diagram + per-record dot
     stepper, hand-built CSS/HTML like the Metrics tab's bars (no charting
     library anywhere in this app, by existing convention). */
  .pipeline-diagram { display: flex; align-items: stretch; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .pnode { border: 1px solid var(--scheme-outline-variant); border-radius: 10px; padding: 0.7rem 1rem;
    min-width: 110px; text-align: center; background: var(--scheme-surface); transition: border-color 0.2s, background 0.2s; }
  .pnode-count { font-family: var(--font-exo); font-size: 1.5rem; line-height: 1.2; font-weight: 700; }
  .pnode-label { font-family: var(--font-gabarito); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.03125rem; opacity: 0.65; margin-top: 0.15rem; }
  .pnode-sub { font-family: var(--font-gabarito); font-size: 0.68rem; opacity: 0.5; margin-top: 0.2rem; }
  .pnode-active { border-color: var(--accent); background: rgba(8, 17, 96, 0.06); }
  .pnode-active .pnode-count { animation: pipeline-pulse-accent 1.8s ease-in-out infinite; }
  .pnode-ok.pnode-active { border-color: var(--ok); background: var(--ok-bg); }
  .pnode-ok.pnode-active .pnode-count { animation: pipeline-pulse-ok 1.8s ease-in-out infinite; color: var(--ok); }
  .pconnector { align-self: center; font-size: 1.3rem; color: var(--scheme-outline-variant); flex: none; }
  @keyframes pipeline-pulse-accent { 0%, 100% { text-shadow: 0 0 0 rgba(8, 17, 96, 0); } 50% { text-shadow: 0 0 10px rgba(8, 17, 96, 0.35); } }
  @keyframes pipeline-pulse-ok { 0%, 100% { text-shadow: 0 0 0 rgba(32, 136, 70, 0); } 50% { text-shadow: 0 0 10px rgba(32, 136, 70, 0.4); } }
  @media (prefers-reduced-motion: reduce) { .pnode-active .pnode-count, .pnode-ok.pnode-active .pnode-count { animation: none; } }

  .pipeline-branches { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .pbranch { display: inline-flex; align-items: center; gap: 0.4rem; border: 1px dashed var(--scheme-outline-variant);
    border-radius: 999px; padding: 0.35rem 0.8rem; font-family: var(--font-gabarito); font-size: 0.78rem; opacity: 0.55; }
  .pbranch-count { font-weight: 700; }
  .pbranch-note { opacity: 0.75; }
  .pbranch.pnode-active { opacity: 1; border-style: solid; border-color: var(--warn); background: var(--warn-bg); }
  .pbranch-err.pnode-active { border-color: var(--err); background: var(--err-bg); }

  .pipeline-caption { margin-top: 0.6rem; opacity: 0.6; }

  .pipeline-list { margin-top: 0.6rem; }
  .pipeline-row { display: grid; grid-template-columns: auto auto minmax(0, 1.3fr) minmax(0, 1.5fr) 90px 46px;
    align-items: center; gap: 0.7rem; padding: 0.5rem 0.75rem; border: 1px solid var(--scheme-outline-variant);
    border-radius: 8px; background: var(--card-bg); font-family: var(--font-gabarito); font-size: 0.85rem; margin-bottom: 0.4rem; }
  .pipeline-row.status-ok { border-left: 3px solid var(--ok); }
  .pipeline-row.status-warn { border-left: 3px solid var(--warn); }
  .pipeline-row.status-err { border-left: 3px solid var(--err); }
  .pipeline-component, .pipeline-version { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pipeline-component { font-weight: 600; }
  .pipeline-version { opacity: 0.75; font-size: 0.8rem; }
  .pipeline-stage-label { font-size: 0.75rem; opacity: 0.7; }
  .pipeline-elapsed { font-size: 0.75rem; opacity: 0.55; text-align: right; font-variant-numeric: tabular-nums; }

  .pipeline-stepper { display: flex; gap: 0.25rem; }
  .pdot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--scheme-outline-variant); flex: none; }
  .pdot-done { background: var(--ok); }
  .pdot-current { background: var(--accent); animation: pipeline-dot-pulse 1.4s ease-in-out infinite; }
  @keyframes pipeline-dot-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(8, 17, 96, 0.4); } 50% { box-shadow: 0 0 0 4px rgba(8, 17, 96, 0); } }
  @media (prefers-reduced-motion: reduce) { .pdot-current { animation: none; } }
</style>
</head>

<script>
  // Close any open <details> (record cards, KB detail panels) when the user
  // clicks outside it -- native <details> only toggles on its own <summary>.
  // Bound once at the document level (not per-element) so it keeps working
  // after htmx swaps content in/out; a click on anything *inside* the open
  // element (its own summary, a link, the close button below) doesn't count
  // as "outside" since Node.contains() covers descendants.
  document.addEventListener("click", function (e) {
    document.querySelectorAll("details[open]").forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute("open");
    });
  });

  // Demo Controls' scan-source radio toggle. Both panels stay in the DOM
  // (only display is toggled) so an in-flight live scan keeps polling even
  // if the user flips back to "Demo data" to look at something else --
  // htmx's own hx-trigger="every Ns" isn't paused by display:none.
  function toggleScanMode(mode) {
    var demoWrap = document.getElementById("scan-demo-wrap");
    var liveWrap = document.getElementById("scan-live-wrap");
    if (demoWrap) demoWrap.style.display = mode === "demo" ? "" : "none";
    if (liveWrap) liveWrap.style.display = mode === "live" ? "" : "none";
  }
</script>
